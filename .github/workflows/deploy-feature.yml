name: deploy-feature

# 피처 번들을 빌드해 S3 에 올리고, 바로 작은 비율의 카나리로 내보낸다.
# stable 로 올리는 것(promote)은 사람이 지표를 보고 release-control 워크플로로 한다.
#
# 필요한 저장소 변수 (Settings > Variables)
#   AWS_ROLE_ARN   infra 를 -c githubRepo=<owner>/<repo> 로 배포하면 나오는 GithubDeployRoleArn
#   AWS_REGION     예: ap-northeast-2
#   OTA_BUCKET     infra 출력의 BucketName
# 변수가 없으면 배포 단계를 건너뛰고 빌드만 확인한다. 공개 저장소를 포크해도 실패하지 않게.
on:
  push:
    branches: [main]
    paths:
      - 'features/**'
  workflow_dispatch:
    inputs:
      feature:
        description: 피처 디렉터리
        type: choice
        options: [cart, profile]
        required: true
      channel:
        description: 채널
        default: prod
        required: true
      canary:
        description: 카나리 비율(1~99)
        default: '5'
        required: true

permissions:
  contents: read
  id-token: write # OIDC 로 AWS 역할을 맡는 데 필요

concurrency:
  # 같은 채널 배포는 한 줄로 세운다. 매니페스트 조건부 쓰기가 있어 겹쳐도 안전하지만, 로그가 읽기 쉬워진다.
  group: deploy-${{ inputs.channel || 'prod' }}
  cancel-in-progress: false

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.pick.outputs.features }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        name: 바뀐 피처 고르기
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'features=["${{ inputs.feature }}"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          # 새 브랜치 첫 푸시처럼 이전 커밋이 없으면 직전 커밋과 비교한다.
          git cat-file -e "$before" 2>/dev/null || before=HEAD^
          list=$(git diff --name-only "$before" HEAD -- features | cut -d/ -f2 | sort -u \
                 | while read -r d; do [ -f "features/$d/package.json" ] && echo "$d"; done | jq -R . | jq -sc .)
          echo "features=$list" >> "$GITHUB_OUTPUT"

  deploy:
    needs: changed
    if: needs.changed.outputs.features != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature: ${{ fromJson(needs.changed.outputs.features) }}
    env:
      CHANNEL: ${{ inputs.channel || 'prod' }}
      CANARY: ${{ inputs.canary || '5' }}
      HAS_AWS: ${{ vars.AWS_ROLE_ARN != '' && vars.OTA_BUCKET != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            features/*/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: features/${{ matrix.feature }}
      - name: 번들 빌드
        working-directory: features/${{ matrix.feature }}
        env:
          # 라벨은 화면 표시용이다. 릴리스 구분은 CLI 가 내용 해시로 한다.
          OTA_LABEL: ${{ github.sha }}
        run: npm run bundle:android && npm run bundle:ios

      - if: env.HAS_AWS != 'true'
        run: echo "::notice::AWS 변수가 없어 업로드를 건너뜁니다 (빌드만 확인)"

      - if: env.HAS_AWS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - if: env.HAS_AWS == 'true'
        name: 업로드, 등록, 카나리
        env:
          OTA_STORE: s3://${{ vars.OTA_BUCKET }}
        run: |
          name=$(node -p "require('./features/${{ matrix.feature }}/package.json').ota.name")
          dir=features/${{ matrix.feature }}
          out=$(npm run --silent ota -- publish "$name" --channel "$CHANNEL" --app "$dir" \
                  --android "$dir/build/generated/android" --ios "$dir/build/generated/ios" \
                  --note "${GITHUB_SHA::7} by ${{ github.actor }}")
          id=$(echo "$out" | jq -r .releaseId)
          npm run --silent ota -- canary "$name" "$id" --ratio "$CANARY" --channel "$CHANNEL"
          echo "### $name → $id (카나리 $CANARY%)" >> "$GITHUB_STEP_SUMMARY"
